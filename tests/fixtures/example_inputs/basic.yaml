v0: 80.0
brake_types:
  - name: FSB
    source: kinematic
  - name: EB
    source: kinematic
  - name: holding
    source: ratio_of_FSB
    ratio: 0.5
requirement:
  FSB:
    mode: a_mean
    value: 1.0
  EB:
    mode: a_mean
    value: 1.2
response_time:
  FSB:
    t1: 0.4
    impulse_rate: 1.5
  EB:
    t1: 0.3
    t2: 0.6
load_groups: [AW0, AW2, AW3]
controller_type: bogie
n_bogies_by_controller: 1
n_springs_by_controller: 2
n_cylinders_by_controller: 4
allocation_strategy: equal_wear
vehicle_config:
  bogies:
    - name: powered_bogie_1
      bogie_type: powered_bogie
    - name: trailer_bogie_1
      bogie_type: trailer_bogie
mass_params:
  powered_bogie:
    mass_static:
      AW0: 10.0
      AW2: 11.0
      AW3: 12.0
    bogie_weight: 2.0
    rotational_mass_factor: 0.08
  trailer_bogie:
    mass_static:
      AW0: 9.0
      AW2: 10.0
      AW3: 11.0
    bogie_weight: 1.5
    rotational_mass_factor: 0.04
air_spring:
  powered_bogie:
    mode: explicit_linear
    airspring_k: 20.0
    airspring_b: 100.0
  trailer_bogie:
    mode: fitted_from_points
    points:
      - pressure_kpa: 180.0
        sprung_mass_by_spring_ton: 5.0
      - pressure_kpa: 220.0
        sprung_mass_by_spring_ton: 7.0
      - pressure_kpa: 260.0
        sprung_mass_by_spring_ton: 9.0
mech_params:
  cylinder_type: tread_cylinder
  Sc: 0.0248
  xi: 0.29
  Li: 3.4
  eta_i: 0.95
  Lo: 1.0
  eta_o: 1.0
  Fs1: 1.0
  Fs2: 0.25
pressure_calibration:
  enabled: true
  calibrated:
    AW0:
      FSB:
        BCP0: 25.0
        k_segments:
          - min_f: 0.0
            max_f: 9999.0
            kind: constant
            value: 10.7
      EB:
        BCP0: 25.0
        k_segments:
          - min_f: 0.0
            max_f: 9999.0
            kind: constant
            value: 11.0
    AW3:
      FSB:
        BCP0: 30.0
        k_segments:
          - min_f: 0.0
            max_f: 9999.0
            kind: constant
            value: 12.0
      EB:
        BCP0: 35.0
        k_segments:
          - min_f: 0.0
            max_f: 9999.0
            kind: constant
            value: 13.0
  fallback:
    AW2: AW3
EB_limit_min: 100.0
