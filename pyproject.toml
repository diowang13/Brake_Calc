[project]
name = "brake-calc"
version = "0.1.0"
description = "Deterministic brake cylinder pressure standard calculator for urban rail trains."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "numpy>=2.2,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11,<0.12",
]

[project.scripts]
brake-calc = "brake_calc.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brake_calc"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/brake_calc/contracts/*.py" = ["N815"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["brake_calc"]
